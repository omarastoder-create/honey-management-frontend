<!-- src/app/component/transaction-create/transaction-create.html -->
<div class="transaction-form-container">
  <div class="form-header">
    <h2>Neuen Verkauf erfassen</h2>
    <p class="subtitle">Positionen hinzufügen, Sonderpreise vergeben oder als Geschenk verbuchen</p>
  </div>

  @if (errorMessage()) {
    <div class="alert-error">
      ⚠️ {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
    <div class="parties-grid">
      <div class="form-group">
        <label for="sellerSelect">Verkäufer *</label>
        <select id="sellerSelect" formControlName="sellerId">
          <option value="" disabled>-- Verkäufer wählen --</option>
          @for (seller of sellers(); track seller.sellerId) {
            <option [value]="seller.sellerId">{{ seller.name }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="customerSelect">Käufer *</label>
        <select id="customerSelect" formControlName="customerId">
          <option value="" disabled>-- Käufer wählen --</option>
          @for (customer of customers(); track customer.customerId) {
            <option [value]="customer.customerId">{{ customer.name }}</option>
          }
        </select>
      </div>
    </div>

    <div class="items-section" formArrayName="items">
      <div class="items-header">
        <h3>Verkaufspositionen</h3>
        <button type="button" class="btn-add-item" (click)="addItem()">
          + Position hinzufügen
        </button>
      </div>

      @for (item of items.controls; track $index; let i = $index) {
        <div class="item-row" [formGroupName]="i" [class.is-gift-row]="item.get('isGift')?.value">
          <div class="form-group flex-product">
            <label>Produkt *</label>
            <select formControlName="productId">
              <option value="" disabled>-- Produkt wählen --</option>
              @for (product of products(); track product.productId) {
                <option [value]="product.productId">
                  {{ product.description }} (€{{ product.pricePerUnit | number:'1.2-2' }} | Bestand: {{ product.unitsToSell }})
                </option>
              }
            </select>
          </div>

          <div class="form-group flex-qty">
            <label>Menge *</label>
            <input type="number" formControlName="quantity" min="1" />
          </div>

          <!-- NEU: Eingabefeld für Sonderpreis / Rabatt -->
          <div class="form-group flex-price">
            <label>Sonderpreis (€ / Stk.)</label>
            <input
              type="number"
              step="0.01"
              min="0"
              formControlName="customPricePerUnit"
              [placeholder]="item.get('isGift')?.value ? '0.00 (Geschenk)' : 'Standardpreis'"
            />
          </div>

          <!-- NEU: Checkbox / Button für Geschenk -->
          <div class="form-group flex-gift">
            <label class="gift-checkbox-label">
              <input type="checkbox" formControlName="isGift" />
              <span>🎁 Als Geschenk (€0,00)</span>
            </label>
          </div>

          @if (items.length > 1) {
            <button
              type="button"
              class="btn-remove-item"
              (click)="removeItem(i)"
              title="Position entfernen"
            >
              🗑️
            </button>
          }
        </div>
      }
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-submit" [disabled]="transactionForm.invalid">
        Verkauf abschließen
      </button>
    </div>
  </form>
</div>
